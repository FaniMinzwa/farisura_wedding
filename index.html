```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Faris & Maisura | Wedding Memories</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f2ec;
            color: #4b3b32;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 5px;
        }

        h2 {
            font-weight: normal;
            margin-top: 5px;
        }

        .intro {
            max-width: 500px;
            margin: 20px auto 30px;
            line-height: 1.7;
        }

        .upload-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
        }

        input {
            margin: 20px 0;
            max-width: 100%;
        }

        button {
            background: #6b5548;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
        }

        .gallery-title {
            margin-top: 60px;
            margin-bottom: 25px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .gallery img:hover {
            transform: scale(1.02);
        }


        /* FULL-SCREEN VIEWER */

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: pan-y;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 88vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            user-select: none;
            -webkit-user-drag: none;
        }


        /* CLOSE BUTTON */

        .close-button {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 28px;
            padding: 0;
            z-index: 10;
        }


        /* ARROW BUTTONS */

        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 30px;
            padding: 0;
            z-index: 10;
        }

        .previous-button {
            left: 20px;
        }

        .next-button {
            right: 20px;
        }


        /* PHOTO COUNTER */

        .photo-counter {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.35);
            padding: 7px 14px;
            border-radius: 20px;
            z-index: 10;
        }


        /* DOWNLOAD BUTTON */

        .download-button {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #4b3b32;
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            z-index: 10;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 30px;
            }

            .lightbox-content {
                max-width: 96vw;
                max-height: 78vh;
            }

            .nav-button {
                width: 42px;
                height: 42px;
                font-size: 24px;
            }

            .previous-button {
                left: 8px;
            }

            .next-button {
                right: 8px;
            }

        }


        /* HIDE ARROWS ON VERY SMALL PHONES */

        @media (max-width: 480px) {

            .nav-button {
                display: none;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>Faris & Maisura</h1>

    <h2>Our Wedding Memories 🤍</h2>

    <p class="intro">
        Capture a little moment from our special day
        and share it with us.
    </p>


    <div class="upload-box">

        <input
            type="file"
            id="photo"
            accept="image/*"
        >

        <br>

        <button id="uploadButton">
            Upload Photo
        </button>

        <div id="status"></div>

    </div>


    <h2 class="gallery-title">
        Moments From Our Day
    </h2>


    <div
        id="gallery"
        class="gallery"
    ></div>


</div>



<!-- FULL-SCREEN PHOTO VIEWER -->

<div
    id="lightbox"
    class="lightbox"
>

    <button
        id="closeButton"
        class="close-button"
        aria-label="Close"
    >
        ×
    </button>


    <div
        id="photoCounter"
        class="photo-counter"
    >
        1 / 1
    </div>


    <button
        id="previousButton"
        class="nav-button previous-button"
        aria-label="Previous photo"
    >
        ‹
    </button>


    <img
        id="lightboxImage"
        class="lightbox-content"
        alt="Wedding photo"
    >


    <button
        id="nextButton"
        class="nav-button next-button"
        aria-label="Next photo"
    >
        ›
    </button>


    <a
        id="downloadButton"
        class="download-button"
        href="#"
        download
    >
        ↓ Save Photo
    </a>

</div>



<script>


const SUPABASE_URL =
    "https://bifsngoytsdmbslzmkyo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_v7LqDPohz2SdwOgWikvspg_9Zswa7xn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



const uploadButton =
    document.getElementById("uploadButton");


const photoInput =
    document.getElementById("photo");


const status =
    document.getElementById("status");


const gallery =
    document.getElementById("gallery");


const lightbox =
    document.getElementById("lightbox");


const lightboxImage =
    document.getElementById("lightboxImage");


const closeButton =
    document.getElementById("closeButton");


const downloadButton =
    document.getElementById("downloadButton");


const previousButton =
    document.getElementById("previousButton");


const nextButton =
    document.getElementById("nextButton");


const photoCounter =
    document.getElementById("photoCounter");



/* STORE ALL GALLERY PHOTOS */

let galleryPhotos = [];

let currentPhotoIndex = 0;



/* LOAD GALLERY */

async function loadGallery() {

    gallery.innerHTML = "";

    galleryPhotos = [];


    const { data, error } =
        await supabaseClient
            .storage
            .from("wedding-photos")
            .list("", {
                limit: 100,
                sortBy: {
                    column: "created_at",
                    order: "desc"
                }
            });


    if (error) {

        console.error(error);

        gallery.innerHTML =
            "<p>Unable to load gallery.</p>";

        return;
    }


    data.forEach(file => {

        if (!file.name) return;


        const {
            data: publicUrlData
        } =
            supabaseClient
                .storage
                .from("wedding-photos")
                .getPublicUrl(file.name);


        galleryPhotos.push({

            name: file.name,

            url: publicUrlData.publicUrl

        });


    });


    galleryPhotos.forEach(
        (photo, index) => {

            const img =
                document.createElement("img");


            img.src =
                photo.url;


            img.loading =
                "lazy";


            img.addEventListener(
                "click",
                () => {

                    openLightbox(index);

                }
            );


            gallery.appendChild(img);

        }
    );

}



/* OPEN PHOTO VIEWER */

function openLightbox(index) {

    if (
        galleryPhotos.length === 0
    ) {

        return;

    }


    currentPhotoIndex =
        index;


    updateLightbox();


    lightbox.classList.add(
        "active"
    );

}



/* UPDATE CURRENT PHOTO */

function updateLightbox() {

    const photo =
        galleryPhotos[
            currentPhotoIndex
        ];


    if (!photo) return;


    lightboxImage.src =
        photo.url;


    downloadButton.href =
        photo.url;


    downloadButton.download =
        photo.name;


    photoCounter.textContent =
        (currentPhotoIndex + 1) +
        " / " +
        galleryPhotos.length;

}



/* NEXT PHOTO */

function nextPhoto() {

    if (
        galleryPhotos.length === 0
    ) {

        return;

    }


    currentPhotoIndex =
        (
            currentPhotoIndex + 1
        ) %
        galleryPhotos.length;


    updateLightbox();

}



/* PREVIOUS PHOTO */

function previousPhoto() {

    if (
        galleryPhotos.length === 0
    ) {

        return;

    }


    currentPhotoIndex =
        (
            currentPhotoIndex -
            1 +
            galleryPhotos.length
        ) %
        galleryPhotos.length;


    updateLightbox();

}



/* CLOSE VIEWER */

function closeLightbox() {

    lightbox.classList.remove(
        "active"
    );

    lightboxImage.src = "";

}



/* BUTTONS */

closeButton.addEventListener(
    "click",
    closeLightbox
);


nextButton.addEventListener(
    "click",
    nextPhoto
);


previousButton.addEventListener(
    "click",
    previousPhoto
);



/* CLICK OUTSIDE PHOTO TO CLOSE */

lightbox.addEventListener(
    "click",
    (event) => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);



/* KEYBOARD CONTROLS */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            !lightbox.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key === "Escape"
        ) {

            closeLightbox();

        }


        if (
            event.key === "ArrowRight"
        ) {

            nextPhoto();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousPhoto();

        }

    }
);



/* SWIPE CONTROLS */

let touchStartX = 0;

let touchEndX = 0;



lightbox.addEventListener(
    "touchstart",
    (event) => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    { passive: true }
);



lightbox.addEventListener(
    "touchend",
    (event) => {

        touchEndX =
            event.changedTouches[0].screenX;


        const swipeDistance =
            touchEndX -
            touchStartX;


        if (
            Math.abs(swipeDistance) <
            50
        ) {

            return;

        }


        if (
            swipeDistance < 0
        ) {

            nextPhoto();

        } else {

            previousPhoto();

        }

    },
    { passive: true }
);



/* UPLOAD PHOTO */

uploadButton.addEventListener(
    "click",
    async () => {

        const file =
            photoInput.files[0];


        if (!file) {

            status.textContent =
                "Please choose a photo first.";

            return;

        }


        uploadButton.disabled =
            true;


        status.textContent =
            "Uploading...";


        const fileName =
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2) +
            "-" +
            file.name;


        const { error } =
            await supabaseClient
                .storage
                .from("wedding-photos")
                .upload(
                    fileName,
                    file
                );


        if (error) {

            console.error(error);

            status.textContent =
                "Upload failed: " +
                error.message;


            uploadButton.disabled =
                false;


            return;

        }


        status.textContent =
            "Photo uploaded successfully 🤍";


        photoInput.value = "";


        uploadButton.disabled =
            false;


        await loadGallery();

    }
);



/* INITIAL LOAD */

loadGallery();


</script>


</body>

</html>
```
