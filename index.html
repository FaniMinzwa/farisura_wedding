<body>


<div class="container">

    <h1>Faris & Maisura</h1>

    <h2>Our Wedding Memories 🤍</h2>

    <p class="intro">
        Capture a little moment from our special day
        and share it with us.

    <div class="upload-box">

        <input

            multiple

        <br>

        <button id="uploadButton">
            Upload Photo
        </button>

        <div id="status"></div>

    </div>


    <h2 class="gallery-title">
        Moments From Our Day
    </h2>


   <div
    id="gallery"
    class="gallery"
></div>

<button
    id="showMoreButton"
    class="show-more-button"
    type="button"
>
    ↓
    <span>See Other Photos</span>
</button>
    <section class="wishes-section">

    <h2 class="gallery-title">
        Leave a Little Wish
    </h2>

    <p class="wishes-intro">
        Leave a little note for Faris & Maisura 🤍
    </p>

    <form id="wishForm">

        <input
            type="text"
            id="wishName"
            placeholder="Your name (optional)"
        >

        <label class="anonymous-option">
            <input
                type="checkbox"
                id="anonymousWish"
            >
            Send anonymously
        </label>

        <textarea
            id="wishMessage"
            placeholder="Write your wish here..."
            rows="5"
            required
        ></textarea>

        <button
            type="submit"
            id="wishSubmitButton"
        >
            Send Wish
        </button>

        <p id="wishStatus"></p>

    </form>

</section>

    <section class="wish-display-section">

    <h2 class="gallery-title">
        A Little Note For You
    </h2>

    <div id="wishCardContainer" class="wish-card-container">
        <div class="wish-card">
            <p class="wish-card-message">
                Loading little notes... 🤍
            </p>
        </div>
    </div>

    <div
        id="wishDots"
        class="wish-dots"
    ></div>

</section>

</div>


<!-- Full-screen photo viewer -->

<div
    id="lightbox"
    class="lightbox"
>

    <button
        id="prevButton"
        class="nav-button prev-button"
        aria-label="Previous photo"
    >
        ‹
    </button>

        id="photoCounter"

    class="download-button"

>
    ↓ Save Photo
</button>

<script>


const SUPABASE_URL =
    "https://bifsngoytsdmbslzmkyo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_v7LqDPohz2SdwOgWikvspg_9Zswa7xn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const uploadButton =
    document.getElementById("uploadButton");


const photoInput =
    document.getElementById("photo");


const status =
    document.getElementById("status");


const gallery =
    document.getElementById("gallery");


const lightbox =
    document.getElementById("lightbox");


const lightboxImage =
    document.getElementById("lightboxImage");


const closeButton =
    document.getElementById("closeButton");


const downloadButton =
    document.getElementById("downloadButton");
const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const photoCounter =
    document.getElementById("photoCounter");

let galleryPhotos = [];
let currentPhotoIndex = 0;


async function loadGallery() {

    gallery.innerHTML = "";

    const { data, error } =
        await supabaseClient
            .storage
            .from("wedding-photos")
            .list("", {
                limit: 100,
                sortBy: {
                    column: "created_at",
                    order: "desc"
                }
            });


    if (error) {

        console.error(error);

        gallery.innerHTML =
            "<p>Unable to load gallery.</p>";

        return;
    }

galleryPhotos = data.filter(file => file.name);
    data.forEach((file, index) => {

    if (!file.name) return;

    const {
        data: publicUrlData
    } =
        supabaseClient
            .storage
            .from("wedding-photos")
            .getPublicUrl(file.name);

    const img =
        document.createElement("img");

    img.src =
        publicUrlData.publicUrl;

    img.loading =
        "lazy";

    if (index >= 8) {
    img.style.display = "none";
}

    img.addEventListener(
        "click",
        () => {

            currentPhotoIndex =
                galleryPhotos.findIndex(
                    photo =>
                        photo.name === file.name
                );

            showPhoto(currentPhotoIndex);

            lightbox.classList.add(
                "active"
            );
        }
    );

    gallery.appendChild(img);
});

}


function showPhoto(index) {

    if (!galleryPhotos.length) return;

    if (index < 0) {
        index = galleryPhotos.length - 1;
    }

    if (index >= galleryPhotos.length) {
        index = 0;
    }

    currentPhotoIndex = index;

    const file = galleryPhotos[currentPhotoIndex];

    const {
        data: publicUrlData
    } =
        supabaseClient
            .storage
            .from("wedding-photos")
            .getPublicUrl(file.name);

    lightboxImage.src =
        publicUrlData.publicUrl;

    downloadButton.dataset.url =
    publicUrlData.publicUrl;

downloadButton.dataset.filename =
    file.name;

    photoCounter.textContent =
        (currentPhotoIndex + 1) +
        " / " +
        galleryPhotos.length;
}
function closeLightbox() {

    lightbox.classList.remove("active");

    lightboxImage.src = "";

}



closeButton.addEventListener(
    "click",
    closeLightbox
);
prevButton.addEventListener(
    "click",
    () => {
        showPhoto(currentPhotoIndex - 1);
    }
);

nextButton.addEventListener(
    "click",
    () => {
        showPhoto(currentPhotoIndex + 1);
    }
);
let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener(
    "touchstart",
    (event) => {
        touchStartX = event.changedTouches[0].screenX;
    },
    { passive: true }
);
downloadButton.addEventListener(
    "click",
    async () => {

        const url =
            downloadButton.dataset.url;

        const filename =
            downloadButton.dataset.filename;

        if (!url) return;

        try {

            const response =
                await fetch(url);

            const blob =
                await response.blob();

            const file =
                new File(
                    [blob],
                    filename,
                    {
                        type: blob.type
                    }
                );

            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files: [file]
                })
            ) {

                await navigator.share({
                    files: [file],
                    title: "Wedding Photo"
                });

            } else {

                const link =
                    document.createElement("a");

                link.href =
                    URL.createObjectURL(blob);

                link.download =
                    filename;

                document.body.appendChild(link);

                link.click();

                link.remove();

                URL.revokeObjectURL(
                    link.href
                );

            }

        } catch (error) {

            console.error(error);

        }

    }
);
lightbox.addEventListener(
    "touchend",
    (event) => {

        touchEndX =
            event.changedTouches[0].screenX;

        const swipeDistance =
            touchEndX - touchStartX;

        if (Math.abs(swipeDistance) < 50) {
            return;
        }

        if (swipeDistance < 0) {
            showPhoto(currentPhotoIndex + 1);
        } else {
            showPhoto(currentPhotoIndex - 1);
        }

    },
    { passive: true }
);

lightbox.addEventListener(
    "click",
    (event) => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);



document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Escape"
        ) {

            closeLightbox();

        }

    }
);



uploadButton.addEventListener(
    "click",
    async () => {

        const files =
            Array.from(photoInput.files);

        if (!files.length) {

            status.textContent =
                "Please choose at least one photo.";

            return;

        }

        uploadButton.disabled = true;

        for (let i = 0; i < files.length; i++) {

            const file = files[i];

            status.textContent =
                "Uploading " +
                (i + 1) +
                " of " +
                files.length +
                "...";

            const fileName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2) +
                "-" +
                file.name;

            const { error } =
                await supabaseClient
                    .storage
                    .from("wedding-photos")
                    .upload(
                        fileName,
                        file
                    );

            if (error) {

                console.error(error);

                status.textContent =
                    "Upload failed: " +
                    error.message;

                uploadButton.disabled =
                    false;

                return;
            }
        }

        status.textContent =
            files.length +
            " photo" +
            (files.length === 1 ? "" : "s") +
            " uploaded successfully 🤍";

        uploadButton.disabled =
            false;

        photoInput.value =
            "";

                await loadGallery();

    }
);


loadGallery();


const showMoreButton =
    document.getElementById("showMoreButton");

showMoreButton.addEventListener(
    "click",
    () => {

        const extraPhotos =
            gallery.querySelectorAll(
                "img"
            );

        extraPhotos.forEach((photo, index) => {

            if (index >= 8) {
                photo.style.display = "block";
            }

        });

        showMoreButton.style.display =
            "none";
    }
);


/* WISHES */

const wishForm =
    document.getElementById("wishForm");

const wishName =
    document.getElementById("wishName");

const anonymousWish =
    document.getElementById("anonymousWish");

const wishMessage =
    document.getElementById("wishMessage");

const wishSubmitButton =
    document.getElementById("wishSubmitButton");

const wishStatus =
    document.getElementById("wishStatus");


wishForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        wishSubmitButton.disabled = true;

        wishStatus.textContent =
            "Sending your wish...";

        const name =
            anonymousWish.checked
                ? "Anonymous"
                : wishName.value.trim();

        const message =
            wishMessage.value.trim();

        const { error } =
            await supabaseClient
                .from("wishes")
                .insert([
                    {
                        name:
                            name || "Anonymous",
                        message:
                            message
                    }
                ]);

        if (error) {

            console.error(error);

            wishStatus.textContent =
                "Something went wrong. Please try again.";

            wishSubmitButton.disabled =
                false;

            return;
        }

        wishStatus.textContent =
            "Your wish has been sent 🤍";

        wishForm.reset();

        wishSubmitButton.disabled =
            false;

    }
);
/* DISPLAY WISHES */

const wishCardContainer =
    document.getElementById("wishCardContainer");

const wishDots =
    document.getElementById("wishDots");


async function loadWishes() {

    const { data, error } =
        await supabaseClient
            .from("wishes")
            .select("*")
            .order("created_at", {
                ascending: true
            });

    if (error) {

        console.error(error);

        wishCardContainer.innerHTML =
            `
            <div class="wish-card">
                <p class="wish-card-message">
                    Unable to load wishes 🤍
                </p>
            </div>
            `;

        return;
    }

    if (!data || !data.length) {

        wishCardContainer.innerHTML =
            `
            <div class="wish-card">
                <p class="wish-card-message">
                    Be the first to leave a little wish 🤍
                </p>
            </div>
            `;

        return;
    }

    wishCardContainer.innerHTML = "";
    wishDots.innerHTML = "";

    data.forEach((wish, index) => {

        const card =
            document.createElement("div");

        card.className = "wish-card";

        card.innerHTML =
            `
            <p class="wish-card-message">
                ${wish.message}
            </p>

            <p class="wish-card-name">
                — ${wish.name || "Anonymous"}
            </p>
            `;

        wishCardContainer.appendChild(card);


        const dot =
            document.createElement("span");

        dot.className = "wish-dot";

        if (index === 0) {
            dot.classList.add("active");
        }

        wishDots.appendChild(dot);

    });

}


loadWishes();
</script>
</body>

</html>
