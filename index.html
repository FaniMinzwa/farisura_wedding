```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Faris & Maisura | Wedding Memories</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f2ec;
            color: #4b3b32;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 5px;
        }

        h2 {
            font-weight: normal;
            margin-top: 5px;
        }

        .intro {
            max-width: 500px;
            margin: 20px auto 30px;
            line-height: 1.7;
        }

        .upload-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
        }

        input {
            margin: 20px 0;
            max-width: 100%;
        }

        button {
            background: #6b5548;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
        }

        .gallery-title {
            margin-top: 60px;
            margin-bottom: 25px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .gallery img:hover {
            transform: scale(1.02);
        }


        /* FULL-SCREEN VIEWER */

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: pan-y;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 88vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            user-select: none;
            -webkit-user-drag: none;
        }


        /* CLOSE BUTTON */

        .close-button {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 28px;
            padding: 0;
            z-index: 10;
        }


        /* ARROW BUTTONS */

        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 30px;
            padding: 0;
            z-index: 10;
        }

        .previous-button {
            left: 20px;
        }

        .next-button {
            right: 20px;
        }


        /* PHOTO COUNTER */

        .photo-counter {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.35);
            padding: 7px 14px;
            border-radius: 20px;
            z-index: 10;
        }


        /* DOWNLOAD BUTTON */

        .download-button {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #4b3b32;
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            z-index: 10;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 30px;
            }

            .lightbox-content {
                max-width: 96vw;
                max-height: 78vh;
            }

            .nav-button {
                width: 42px;
                height: 42px;
                font-size: 24px;
            }

            .previous-button {
                left: 8px;
            }

            .next-button {
                right: 8px;
            }

        }


        /* HIDE ARROWS ON VERY SMALL PHONES */

        @media (max-width: 480px) {

            .nav-button {
                display: none;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>Faris & Maisura</h1>

    <h2>Our Wedding Memories 🤍</h2>

    <p class="intro">
        Capture a little moment from our special day
        and share it with us.
    </p>


    <div class="upload-box">

        <input
            type="file"
            id="photo"
            accept="image/*"
        >

        <br>

        <button id="uploadButton">
            Upload Photo
        </button>

        <div id="status"></div>

    </div>


    <h2 class="gallery-title">
        Moments From Our Day
    </h2>


    <div
        id="gallery"
        class="gallery"
    ></div>


</div>



<!-- FULL-SCREEN PHOTO VIEWER -->

<div
    id="lightbox"
    class="lightbox"
>

    <button
        id="closeButton"
        class="close-button"
        aria-label="Close"
    >
        ×
    </button>


    <div
        id="photoCounter"
        class="photo-counter"
    >
        1 / 1
```
